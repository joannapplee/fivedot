<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 455 190" role="img" aria-labelledby="title desc">
  <title id="title">5 Dot Zero</title>
  <desc id="desc">5 Dot Zero logo with orange mark, white wordmark, and blue tagline.</desc>
  <defs>
    <linearGradient id="orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9700"/>
      <stop offset="1" stop-color="#f06b00"/>
    </linearGradient>
    <linearGradient id="white" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#dedede"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000" flood-opacity=".45"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <rect x="5" y="5" width="58" height="108" rx="2" fill="url(#orange)"/>
    <path d="M68 5h60c0 29-11 53-33 72-8 7-17 12-27 14z" fill="url(#orange)"/>
    <path d="M68 95h60v90H68z" fill="url(#orange)"/>
    <path d="M68 95c33 0 60 27 60 60s-27 30-60 30z" fill="url(#orange)"/>
    <circle cx="34" cy="145" r="29" fill="url(#orange)"/>
  </g>
  <g filter="url(#shadow)" fill="url(#white)" font-family="'Barlow Condensed','Arial Narrow',Impact,sans-serif" font-weight="900">
    <text x="155" y="78" font-size="76" letter-spacing="1">DOT</text>
    <text x="155" y="158" font-size="76" letter-spacing="1">ZERO</text>
  </g>
  <text x="8" y="187" fill="#8fa8ce" font-family="'Space Mono','Courier New',monospace" font-size="18" letter-spacing="5">
    Building the Future, Together
  </text>
</svg>
